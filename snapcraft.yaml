name: telegraf
base: core22
adopt-info: telegraf
summary: Telegraf agent
description: |
  Telegraf is an agent written in Go for collecting, processing, aggregating, and writing metrics
confinement: classic
grade: stable
passthrough:
  system-usernames:
    snap_daemon: shared

# armhf and i386 are 32-bit targets. Building natively on those
# Launchpad builders means the Go compiler/linker themselves run as
# 32-bit processes with a small (~3GB) virtual address space; telegraf's
# huge cmd/telegraf binary (all plugins) exceeds that, crashing with
# "fatal error: runtime: cannot allocate memory" or "mapping output file
# failed: cannot allocate memory". Cross-compiling them from the amd64
# builder runs the toolchain as a 64-bit process instead, sidestepping
# the limit entirely. The other, 64-bit architectures keep building
# natively.
architectures:
  - build-on: [amd64]
    build-for: [amd64]
  - build-on: [arm64]
    build-for: [arm64]
  - build-on: [ppc64el]
    build-for: [ppc64el]
  - build-on: [s390x]
    build-for: [s390x]
  - build-on: [amd64]
    build-for: [armhf]
  - build-on: [amd64]
    build-for: [i386]

apps:
  telegraf:
    command: 'bin/telegraf.wrapper'
    daemon: simple

parts:
  ## This wrapper will be called to start telegraf. It will use setpriv to run
  ## as the snap_daemon user https://snapcraft.io/docs/system-usernames
  snap-wrappers:
    plugin: dump
    source: .
    organize:
      telegraf.snap_wrapper: bin/telegraf.wrapper
    stage:
      - bin

  telegraf:
    build-attributes:
      - enable-patchelf
    plugin: nil
    build-snaps: [go/latest/stable]
    build-packages: [make, gcc, git]
    stage-packages: [util-linux]
    override-build: |
      git clone https://github.com/influxdata/telegraf.git
      cd telegraf
      tag="$(git tag -l | egrep -v '\-rc' | sort -rV | head -n 1)"
      version="$(echo $tag | cut -d 'v' -f 2)"
      snapcraftctl set-version "$version"
      git checkout tags/$tag
      # Cross-compile for the 32-bit targets (see the top-level
      # `architectures` key); this build always runs on an amd64 host.
      case "$CRAFT_ARCH_BUILD_FOR" in
        armhf) export GOOS=linux GOARCH=arm GOARM=7 ;;
        i386)  export GOOS=linux GOARCH=386 ;;
      esac
      LDFLAGS='' make build
      mkdir -p $SNAPCRAFT_PART_INSTALL/bin
      mkdir -p $SNAPCRAFT_PART_INSTALL/etc
      ./telegraf config > $SNAPCRAFT_PART_INSTALL/etc/telegraf.conf
      cp -p telegraf $SNAPCRAFT_PART_INSTALL/bin/
      cp -p -r etc $SNAPCRAFT_PART_INSTALL/
