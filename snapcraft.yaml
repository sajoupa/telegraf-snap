name: telegraf
base: core22
adopt-info: telegraf
summary: Telegraf agent
description: |
  Telegraf is an agent written in Go for collecting, processing, aggregating, and writing metrics
confinement: classic
grade: stable
passthrough:
  system-usernames:
    snap_daemon: shared

apps:
  telegraf:
    command: 'bin/telegraf.wrapper'
    daemon: simple

parts:
  ## This wrapper will be called to start telegraf. It will use setpriv to run
  ## as the snap_daemon user https://snapcraft.io/docs/system-usernames
  snap-wrappers:
    plugin: dump
    source: .
    organize:
      telegraf.snap_wrapper: bin/telegraf.wrapper
    stage:
      - bin

  telegraf:
    build-attributes:
      - enable-patchelf
    plugin: nil
    build-snaps: [go/latest/stable]
    build-packages: [make, gcc, git, libc6-dev]
    stage-packages: [util-linux]
    override-build: |
      git clone https://github.com/influxdata/telegraf.git
      cd telegraf
      tag="$(git tag -l | egrep -v '\-rc' | sort -rV | head -n 1)"
      version="$(echo $tag | cut -d 'v' -f 2)"
      snapcraftctl set-version "$version"
      git checkout tags/$tag
      # armhf is a 32-bit target with a small process address space.
      # Compiling telegraf's huge cmd/telegraf package (all plugins,
      # inlined) can exhaust it during compilation ("fatal error: runtime:
      # cannot allocate memory"); disabling inlining and compiling one
      # package at a time keeps the compiler's memory use down. The Go
      # internal linker also mmaps the entire output binary in one go,
      # which fails the same way once the binary is too large for a
      # 32-bit address space ("mapping output file failed"), so switch to
      # the external (system) linker there instead, which streams the
      # output rather than mapping it all at once. Statically link it
      # (-extldflags=-static) and force the pure-Go DNS resolver
      # (netgo build tag) so the resulting binary stays glibc/kernel
      # version independent, same as the other, purely statically
      # Go-linked architectures.
      if [ "$CRAFT_ARCH_BUILD_FOR" = "armhf" ]; then
        sed -i 's|^\tCGO_ENABLED=0 go build -tags "\$(BUILDTAGS)" -ldflags "\$(LDFLAGS)" ./cmd/telegraf$|\tCGO_ENABLED=1 go build -tags "$(BUILDTAGS)" -ldflags "$(LDFLAGS)" ./cmd/telegraf|' Makefile
        export GOFLAGS='-p=1 -gcflags=all=-l'
        export BUILDTAGS='netgo'
        LDFLAGS='-s -w -linkmode=external -extld=gcc -extldflags=-static' make build
      else
        LDFLAGS='' make build
      fi
      mkdir -p $SNAPCRAFT_PART_INSTALL/bin
      mkdir -p $SNAPCRAFT_PART_INSTALL/etc
      ./telegraf config > $SNAPCRAFT_PART_INSTALL/etc/telegraf.conf
      cp -p telegraf $SNAPCRAFT_PART_INSTALL/bin/
      cp -p -r etc $SNAPCRAFT_PART_INSTALL/
