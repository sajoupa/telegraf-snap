name: telegraf
base: core22
adopt-info: telegraf
summary: Telegraf agent
description: |
  Telegraf is an agent written in Go for collecting, processing, aggregating, and writing metrics
confinement: classic
grade: stable
passthrough:
  system-usernames:
    snap_daemon: shared

apps:
  telegraf:
    command: 'bin/telegraf.wrapper'
    daemon: simple

parts:
  ## This wrapper will be called to start telegraf. It will use setpriv to run
  ## as the snap_daemon user https://snapcraft.io/docs/system-usernames
  snap-wrappers:
    plugin: dump
    source: .
    organize:
      telegraf.snap_wrapper: bin/telegraf.wrapper
    stage:
      - bin

  telegraf:
    build-attributes:
      - enable-patchelf
    plugin: nil
    build-snaps: [go/latest/stable]
    build-packages: [make, gcc, git]
    stage-packages: [util-linux]
    override-build: |
      git clone https://github.com/influxdata/telegraf.git
      cd telegraf
      tag="$(git tag -l | egrep -v '\-rc' | sort -rV | head -n 1)"
      version="$(echo $tag | cut -d 'v' -f 2)"
      snapcraftctl set-version "$version"
      git checkout tags/$tag
      # armhf is a 32-bit target: the Go compiler has a ~3-4GB virtual
      # address space ceiling there, and compiling telegraf's huge
      # cmd/telegraf package (all plugins, inlined) blows past it with
      # "fatal error: runtime: cannot allocate memory" (a hard crash, hence
      # the empty build log). Disabling inlining and compiling one package
      # at a time drastically cuts compiler memory use on that arch only.
      if [ "$CRAFT_ARCH_BUILD_FOR" = "armhf" ]; then
        export GOFLAGS='-p=1 -gcflags=all=-l'
        export GOMAXPROCS=1
        LDFLAGS='-s -w' make build
      else
        LDFLAGS='' make build
      fi
      mkdir -p $SNAPCRAFT_PART_INSTALL/bin
      mkdir -p $SNAPCRAFT_PART_INSTALL/etc
      ./telegraf config > $SNAPCRAFT_PART_INSTALL/etc/telegraf.conf
      cp -p telegraf $SNAPCRAFT_PART_INSTALL/bin/
      cp -p -r etc $SNAPCRAFT_PART_INSTALL/
